name: CI — Statistical Engine Tests & R Package Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-r-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Run zero-dependency statistical engine and parity suite
        run: Rscript tests/run_tests.R

      - name: Install fieldtrial package and run smoke check
        run: |
          R CMD INSTALL .
          Rscript -e "library(fieldtrial); df <- load_sample_trial('rice_split_plot'); mp <- detect_trial_columns(df); mp$main_plot <- 'irrigation'; mp$sub_plot <- 'cultivar'; res <- analyse_field_trial(df, 'split_plot', mp); print(res$anova_table); stopifnot(nrow(res$split_metrics) == 4)"

      - name: Build and check R package cleanly
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          R CMD build .
          R CMD check --no-manual fieldtrial_*.tar.gz
