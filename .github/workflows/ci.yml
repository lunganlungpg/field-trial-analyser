name: CI — Statistical Engine Tests & R Package Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-r-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Run zero-dependency statistical engine and parity suite
        run: Rscript tests/run_tests.R

      - name: Install fieldtrial package and run smoke check
        run: |
          R CMD INSTALL .
          Rscript tests/test-package.R

      - name: Build and check R package cleanly
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          R CMD build .
          R CMD check --no-manual fieldtrial_*.tar.gz
