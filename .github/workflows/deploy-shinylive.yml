name: Deploy Shinylive App to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  shinylive:
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    with:
      app-dir: app
    permissions:
      contents: read
      pages: write
      id-token: write
